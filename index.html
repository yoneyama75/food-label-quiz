<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>食品表示検定 ぽかぽかドリル</title><style>:root{font-family:system-ui,'Yu Gothic',sans-serif;color:#304c46;background:#f7f9ef}*{box-sizing:border-box}body{margin:0}.wrap{max-width:560px;margin:auto;padding:20px}header{background:#d7eee3;padding:22px;border-radius:0 0 26px 26px}h1{font-size:23px;margin:5px 0}h2{font-size:20px}.card{background:white;border:1px solid #e4ece4;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 3px 12px #aac6b222}button,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:14px 16px;font-weight:bold}.primary{background:#40967e;color:white}.secondary{background:#e4f2ec;color:#276c58}.choice{display:block;width:100%;text-align:left;background:#f3f7f4;margin:10px 0;color:#304c46;border:2px solid transparent}.choice.selected{border-color:#40967e;background:#e0f4e9}.choice:disabled{opacity:1}.small{color:#698077;font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}select{padding:12px;border:1px solid #bfd6ca;border-radius:12px;background:white;max-width:100%}.hidden{display:none}.correct{color:#148060}.wrong{color:#c55368}.badge{display:inline-block;background:#fff0d5;border-radius:30px;padding:5px 12px;font-size:12px}.bar{height:9px;border-radius:9px;background:#e1eae5;overflow:hidden}.bar>div{height:100%;background:#60b597;transition:width .2s}#feedback{line-height:1.8}footer{text-align:center;font-size:12px;color:#71877d;padding:15px}</style></head><body><header><div class="wrap"><div class="badge">📚 食品表示検定 初級・非公式</div><h1>🍎 ぽかぽかドリル</h1><div>通勤中に、ちょこっと勉強 🌷</div></div></header><main class="wrap"><section id="home"><div class="card"><h2>今日も一緒にがんばろう！</h2><p id="stats" class="small"></p><label>出題範囲<br><select id="category"><option value="all">すべての分野</option><option value="法律">法律</option><option value="食品分類">加工食品と生鮮食品</option><option value="表示">表示ルール</option><option value="all-wrong">苦手問題だけ</option></select></label><p>問題数</p><div class="row"><button class="secondary" onclick="setCount(5)" id="n5">5問</button><button class="secondary" onclick="setCount(10)" id="n10">10問</button></div><p>答え合わせ</p><div class="row"><button class="secondary" onclick="setMode('instant')" id="instant">1問ずつ</button><button class="secondary" onclick="setMode('exam')" id="exam">最後にまとめて</button></div><p><button class="primary" style="width:100%" onclick="start()">スタート！ ✨</button></p><p class="small">※履歴はこのブラウザ内に保存。別端末には同期されません。</p></div></section><section id="play" class="hidden"><div class="small" id="progress"></div><div class="bar"><div id="fill"></div></div><div class="card"><div class="badge" id="qcategory"></div><h2 id="question"></h2><div id="choices"></div><div id="feedback" class="hidden"></div><button id="next" class="primary hidden" style="width:100%;margin-top:15px" onclick="next()">次へ →</button></div></section><section id="result" class="hidden"><div class="card"><h2>🎉 おつかれさま！</h2><p id="score"></p><div id="review"></div><button class="primary" style="width:100%" onclick="show('home');updateStats()">ホームに戻る</button></div></section></main><footer>非公式の自主学習用ドリルです。公式教材・最新の食品表示基準も確認してね。</footer><script>
const questions=[
['法律','優良誤認表示や有利誤認表示を禁止するのは食品衛生法である。',['○','×'],1,'優良誤認・有利誤認を禁止するのは景品表示法。食品衛生法は食品の衛生・安全に関する法律です。'],
['法律','食品表示法の対象には酒類や食品添加物も含まれる。',['○','×'],0,'酒類や食品添加物も対象です。一方、医薬品・医薬部外品は対象外です。'],
['法律','医薬部外品は食品表示法の対象となる。',['○','×'],1,'医薬品・医薬部外品は食品表示法の対象外です。'],
['法律','特定商品の内容量の適正な表示に関係する法律はどれ？',['景品表示法','計量法','米トレーサビリティ法','薬機法'],1,'計量法は特定商品の内容量の適正な表示などを定めています。'],
['法律','優良誤認とはどのような表示？',['実際より品質が良いと思わせる','数量を正しく書く','産地を伝える','保存温度を示す'],0,'品質などが実際より著しく優良だと誤認させる表示です。'],
['法律','米トレーサビリティ法では、一部の米加工品にも産地情報の伝達が求められる。',['○','×'],0,'米穀だけでなく対象となる米加工品もあります。'],
['法律','食品衛生法の主な目的として最も近いものは？',['食品の衛生上の危害を防ぐ','商品の値引きを管理する','広告デザインを統一する','食品の重さを決める'],0,'食品衛生法は飲食に起因する衛生上の危害の発生を防止します。'],
['法律','食品表示法の目的には、消費者が食品を自主的・合理的に選べるようにすることも含まれる。',['○','×'],0,'食品表示法は安全性の確保だけでなく、消費者の自主的かつ合理的な食品選択の機会の確保も目的とします。'],
['食品分類','キャベツだけを切って袋詰めしたものは、通常、生鮮食品に分類される。',['○','×'],0,'単品の野菜を単に切断したものは生鮮食品の例です。'],
['食品分類','カットしたキャベツとニンジンを混ぜたサラダミックスは加工食品に分類される。',['○','×'],0,'複数種類の野菜を切断して混ぜ合わせたものは加工食品の例です。'],
['食品分類','調味していない豚バラと豚ロースを1パックに包装したものは生鮮食品の例である。',['○','×'],0,'同じ畜種の肉を調味せず部位ごとに組み合わせた場合は、生鮮食品として扱われる例です。'],
['食品分類','食肉にスパイスを振りかけたものは加工食品の例である。',['○','×'],0,'調味した食肉は加工食品の例です。'],
['食品分類','マグロのトロと赤身を盛り合わせたものは生鮮食品の例である。',['○','×'],0,'同じ魚種の部位違いを盛り合わせた例です。'],
['食品分類','マグロとサーモンの刺身盛り合わせは加工食品の例である。',['○','×'],0,'複数の種類の刺身を盛り合わせたものは加工食品の例です。'],
['食品分類','野菜をブランチング（加熱処理）してから冷凍したものはどちら？',['生鮮食品','加工食品'],1,'加熱処理してから冷凍した野菜は加工食品の例です。'],
['食品分類','蒸しダコは生鮮食品に分類される。',['○','×'],1,'蒸すという加熱処理があるため加工食品です。'],
['食品分類','オゾン水などで殺菌洗浄しただけの野菜は生鮮食品の例である。',['○','×'],0,'洗浄・殺菌洗浄のみなら生鮮食品の例です。'],
['食品分類','合挽肉は加工食品の例である。',['○','×'],0,'異なる畜種の肉を混ぜた合挽肉は加工食品の例です。'],
['表示','添加物は少量しか使わないので、アレルギー表示は必ず不要である。',['○','×'],1,'添加物でも特定原材料に由来する場合など、原則としてアレルギー表示が必要です。'],
['表示','アイスクリーム類は期限表示を省略できる食品に含まれる。',['○','×'],0,'アイスクリーム類は期限表示の省略が認められる例です。'],
['表示','基本の栄養成分表示5項目に含まれないのはどれ？',['熱量','脂質','ビタミンC','食塩相当量'],2,'基本5項目は熱量・たんぱく質・脂質・炭水化物・食塩相当量です。'],
['表示','基本の栄養成分表示5項目は、含有量が0ならその項目を省略できる。',['○','×'],1,'原則として、含有量が0でも基本5項目そのものは省略できません。'],
['表示','内容量が外から容易に分かれば、どんな食品でも必ず内容量表示を省略できる。',['○','×'],1,'一定の条件で省略できる場合はありますが、計量法などの別の規定もあり、無条件ではありません。'],
['表示','アレルギー表示は、ほんの少しなら必ず免除される。',['○','×'],1,'微量でも症状を引き起こす可能性があり、少量というだけで免除にはなりません。'],
['表示','次のうち、基本の栄養成分表示5項目に含まれるものは？',['カルシウム','食塩相当量','食物繊維','ビタミンD'],1,'食塩相当量は基本5項目のひとつです。'],
['法律','有利誤認表示を禁止する法律はどれ？',['食品衛生法','計量法','景品表示法','食品表示法'],2,'有利誤認は価格や取引条件が実際より著しく有利だと思わせる表示で、景品表示法が規制します。'],
['食品分類','1種類の野菜を洗って袋詰めしただけなら、通常は加工食品になる。',['○','×'],1,'単に洗浄して包装しただけの野菜は、通常、生鮮食品として扱われます。'],
['表示','食品表示基準で定められた一部の食品では、期限表示を省略できる。',['○','×'],0,'でん粉、砂糖、アイスクリーム類など、食品表示基準で期限表示の省略が認められた食品があります。'],
['表示','酒類は食品表示法の対象なので、一般の加工食品と同じ栄養成分表示が必ず必要である。',['○','×'],1,'酒類も食品表示法の対象ですが、栄養成分表示は原則として省略できる場合があります。「法律の対象」と「各表示項目の義務」は別に考えましょう。'],
['表示','基本の栄養成分表示で、ナトリウムは通常「食塩相当量」として表示する。',['○','×'],0,'基本の栄養成分表示ではナトリウムの量を食塩相当量に換算して表示します。']
];
let count=5,mode='instant',queue=[],pos=0,answers=[],locked=false;const $=id=>document.getElementById(id);const getLog=()=>{try{return JSON.parse(localStorage.getItem('foodQuizLog')||'{}')}catch{return {}}};const saveLog=x=>localStorage.setItem('foodQuizLog',JSON.stringify(x));function show(id){for(let s of ['home','play','result'])$(s).classList.toggle('hidden',s!==id)}function setCount(n){count=n;for(let v of [5,10])$('n'+v).style.outline=v===n?'3px solid #65b59b':''}function setMode(m){mode=m;for(let v of ['instant','exam'])$(v).style.outline=v===m?'3px solid #65b59b':''}setCount(5);setMode('instant');function updateStats(){let l=getLog(),a=Object.values(l);$('stats').textContent=`これまでの回答 ${a.reduce((s,v)=>s+v.total,0)}回 ／ 正解 ${a.reduce((s,v)=>s+v.correct,0)}回 ／ 苦手 ${a.filter(v=>v.wrong>0).length}問`;}updateStats();function start(){let cat=$('category').value,log=getLog();let ids=questions.map((q,i)=>i).filter(i=>cat==='all'||(cat==='all-wrong'?(log[i]?.wrong||0)>0:questions[i][0]===cat));if(!ids.length){alert('この範囲の問題はまだありません。別の範囲を選んでね！');return}for(let j=ids.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[ids[j],ids[k]]=[ids[k],ids[j]];}queue=ids.slice(0,Math.min(count,ids.length));pos=0;answers=[];show('play');render()}function render(){locked=false;let q=questions[queue[pos]];$('progress').textContent=`${pos+1} / ${queue.length} 問`;$('fill').style.width=`${100*pos/queue.length}%`;$('qcategory').textContent=q[0];$('question').textContent=q[1];$('feedback').classList.add('hidden');$('feedback').innerHTML='';$('next').classList.add('hidden');$('choices').innerHTML='';q[2].forEach((s,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=(q[2].length===2?'':String.fromCharCode(65+i)+'. ')+s;b.onclick=()=>choose(i);$('choices').append(b)})}function choose(i){if(locked)return;locked=true;let id=queue[pos],q=questions[id],ok=i===q[3];answers.push({id,selected:i,ok});let log=getLog();let v=log[id]||{total:0,correct:0,wrong:0};v.total++;if(ok)v.correct++;else v.wrong++;log[id]=v;saveLog(log);[...$('choices').children].forEach((b,j)=>{b.disabled=true;if(j===i)b.classList.add('selected')});if(mode==='instant'){$('feedback').classList.remove('hidden');$('feedback').innerHTML=`<h3 class="${ok?'correct':'wrong'}">${ok?'⭕ 正解！':'❌ おしい！'}</h3><p>正解：${q[2][q[3]]}</p><p>${q[4]}</p>`;} $('next').textContent=pos===queue.length-1?'結果を見る 🎉':'次へ →';$('next').classList.remove('hidden')}function next(){if(pos<queue.length-1){pos++;render()}else{show('result');let n=answers.filter(x=>x.ok).length;$('score').textContent=`${queue.length}問中 ${n}問正解！ 正答率 ${Math.round(100*n/queue.length)}%`;$('review').innerHTML='';answers.forEach((a,i)=>{let q=questions[a.id],d=document.createElement('div');d.style.cssText='padding:13px 0;border-top:1px solid #e4ece4';d.innerHTML=`<strong>${i+1}. ${a.ok?'⭕':'❌'} ${q[1]}</strong><p class="small">あなた：${q[2][a.selected]} ／ 正解：${q[2][q[3]]}</p><p class="small">${q[4]}</p>`;$('review').append(d)})}};
</script></body></html>
