栽培農産物に「減農薬」と表示することは認められている。", ["○", "×"], 1, "削減基準が不明確なため使えません。"], ["加工食品", "加工食品の義務表示には名称、原材料名、添加物、内容量などが含まれる。", ["○", "×"], 0, "テキスト72ページの一覧を参照。"], ["加工食品", "加工食品の「名称」は自由な商品名をそのまま表示すればよい。", ["○", "×"], 1, "名称は食品の内容が分かる一般的名称で表示します。"], ["加工食品", "加工食品の原材料は原則として使用重量割合の高い順に表示する。", ["○", "×"], 0, "原材料の重量順が基本です。"], ["加工食品", "添加物は原則として使用重量割合の高い順に表示する。", ["○", "×"], 0, "添加物も重量割合順が基本です。"], ["加工食品", "食品の名称と商品名は必ず同一である。", ["○", "×"], 1, "名称は一般的名称、商品名は商品の識別のための名前です。"], ["加工食品", "加工食品の原料原産地名は、輸入品も含めすべて同じルールで表示する。", ["○", "×"], 1, "写真の一覧では輸入品を除く加工食品について原料原産地名を説明しています。"], ["加工食品", "表示可能面積がおおむね30cm²以下の容器包装では、一部の表示事項を省略できる。", ["○", "×"], 0, "ただし名称・アレルゲンなど省略できない項目もあります。"], ["加工食品", "表示可能面積が小さければ、アレルゲン表示も省略できる。", ["○", "×"], 1, "アレルゲンは省略できません。"], ["加工食品", "加工食品の義務表示文字は原則8ポイント以上である。", ["○", "×"], 0, "表示可能面積がおおむね150cm²以下の場合は5.5ポイント以上も可能です。"], ["加工食品", "義務表示事項は原則として一括表示する。", ["○", "×"], 0, "別記様式による表示が基本です。"], ["加工食品", "品質の劣化が比較的遅い食品には賞味期限を表示する。", ["○", "×"], 0, "急速に劣化しやすい食品は消費期限です。"], ["原材料", "原材料と添加物は必ず別々の欄に表示しなければならない。", ["○", "×"], 1, "スラッシュや改行等で区分する方法もあります。"], ["原材料", "原材料名欄でスラッシュ「／」を使って原材料と添加物を区分できる。", ["○", "×"], 0, "写真79ページの例です。"], ["原材料", "複合原材料とは2種類以上の原材料からなる原材料をいう。", ["○", "×"], 0, "複合原材料の定義です。"], ["原材料", "複合原材料の原材料は、原則として括弧内に重量割合の高い順で表示する。", ["○", "×"], 0, "原則は括弧内に表示します。"], ["原材料", "複合原材料に3種類以上の原材料がある場合、重量割合が上位3位以下ならすべて「その他」とできる。", ["○", "×"], 1, "上位3位以下でも5%以上使用されているものは「その他」にできません。"], ["原材料", "複合原材料の名称から原材料が明らかな場合、原材料の表示を省略できる場合がある。", ["○", "×"], 0, "写真81ページの例です。"], ["原材料", "複合原材料が製品全体の5%未満なら、その複合原材料の原材料表示を省略できる場合がある。", ["○", "×"], 0, "写真81ページの省略ルールです。"], ["アレルギー", "アレルギー表示は、健康危害の防止を目的とする。", ["○", "×"], 0, "消費者の安全のための表示です。"], ["アレルギー", "テキストでは義務表示の特定原材料は9品目とされている。", ["○", "×"], 0, "写真84ページの表に9品目とあります。"], ["アレルギー", "テキストでは特定原材料に準ずるものは20品目とされている。", ["○", "×"], 0, "写真84ページの表に20品目とあります。"], ["アレルギー", "卵の代替表記として「玉子」が認められている。", ["○", "×"], 0, "写真86ページの表を参照。"], ["アレルギー", "「卵黄」は卵の拡大表記の例である。", ["○", "×"], 0, "卵を含むことが読み取れる表記です。"], ["アレルギー", "「入っているかもしれない」といった可能性表示は認められている。", ["○", "×"], let count=5,mode='instant',queue=[],pos=0,answers=[],locked=false;
const $=id=>document.getElementById(id);const key='foodQuizLog';
function getLog(){try{return JSON.parse(localStorage.getItem(key)||'{}')||{}}catch{return {}}}
function saveLog(v){try{localStorage.setItem(key,JSON.stringify(v))}catch(e){alert('履歴を保存できませんでした。ブラウザの保存設定を確認してね。')}}
function show(id){['home','play','result'].forEach(s=>$(s).classList.toggle('hidden',s!==id));scrollTo(0,0)}
function setCount(n){count=n;document.querySelectorAll('[data-count]').forEach(b=>b.classList.toggle('on',b.dataset.count===String(n)))}
function setMode(m){mode=m;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===m))}
function updateStats(){const a=Object.values(getLog()).filter(x=>x&&typeof x.total==='number');$('stats').textContent=`登録 ${questions.length}問 ／ これまでの回答 ${a.reduce((s,v)=>s+v.total,0)}回 ／ 正解 ${a.reduce((s,v)=>s+v.correct,0)}回 ／ 苦手 ${a.filter(v=>v.wrong>0).length}問`}
function start(){const cat=$('category').value,log=getLog();let ids=questions.map((q,i)=>i).filter(i=>cat==='all'||(cat==='chapter1'?i<80:cat==='chapter23'?i>=80:cat==='all-wrong'?(log[i]?.wrong||0)>0:questions[i][0]===cat));if(!ids.length){alert('この範囲の問題はまだありません。別の範囲を選んでね！');return}for(let j=ids.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[ids[j],ids[k]]=[ids[k],ids[j]]}queue=ids.slice(0,count==='all'?ids.length:Math.min(count,ids.length));pos=0;answers=[];show('play');render()}
function render(){locked=false;let q=questions[queue[pos]];$('progress').textContent=`${pos+1} / ${queue.length} 問`;$('fill').style.width=`${100*pos/queue.length}%`;$('qcategory').textContent='ぽかぽか｜'+q[0];$('question').textContent=q[1];$('feedback').classList.add('hidden');$('feedback').replaceChildren();$('next').classList.add('hidden');$('choices').replaceChildren();q[2].forEach((s,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=(q[2].length===2?'':String.fromCharCode(65+i)+'. ')+s;b.addEventListener('click',()=>choose(i));$('choices').append(b)})}
function para(parent,txt,cls){let p=document.createElement('p');p.textContent=txt;if(cls)p.className=cls;parent.append(p)}
function choose(i){if(locked)return;locked=true;let id=queue[pos],q=questions[id],ok=i===q[3];answers.push({id,selected:i,ok});let log=getLog(),v=log[id]||{total:0,correct:0,wrong:0};v.total++;if(ok){v.correct++;v.wrong=0}else v.wrong++;log[id]=v;saveLog(log);[...$('choices').children].forEach((b,j)=>{b.disabled=true;if(j===i)b.classList.add('selected')});if(mode==='instant'){let f=$('feedback');f.classList.remove('hidden');let h=document.createElement('h3');h.className=ok?'correct':'wrong';h.textContent=ok?'⭕ 正解！':'❌ おしい！';f.append(h);para(f,'正解：'+q[2][q[3]]);para(f,q[4])}$('next').textContent=pos===queue.length-1?'結果を見る 🎉':'次へ →';$('next').classList.remove('hidden')}
function next(){if(pos<queue.length-1){pos++;render();scrollTo(0,0)}else{show('result');let n=answers.filter(x=>x.ok).length;$('score').textContent=`${queue.length}問中 ${n}問正解！ 正答率 ${Math.round(100*n/queue.length)}%`;$('review').replaceChildren();answers.forEach((a,i)=>{let q=questions[a.id],d=document.createElement('div');d.style.cssText='padding:13px 0;border-top:1px solid #e4ece4';let strong=document.createElement('strong');strong.textContent=`${i+1}. ${a.ok?'⭕':'❌'} ${q[1]}`;d.append(strong);para(d,`あなた：${q[2][a.selected]} ／ 正解：${q[2][q[3]]}`,'small');para(d,q[4],'small');$('review').append(d)})}}
document.querySelectorAll('[data-count]').forEach(b=>b.addEventListener('click',()=>setCount(b.dataset.count==='all'?'all':Number(b.dataset.count))));document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));$('start').addEventListener('click',start);$('next').addEventListener('click',next);$('back').addEventListener('click',()=>{show('home');updateStats()});setCount(5);setMode('instant');updateStats();
</script></body></html>
